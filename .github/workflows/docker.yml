name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  # Weekly rebuild: picks up new BeamMP releases and base image updates
  # schedule:
  #   - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      beammp_version:
        description: BeamMP release tag to build (e.g. v3.9.3). Empty for the latest release.
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Resolve "latest" here so the image is tagged with the exact BeamMP version it contains
      - name: Resolve BeamMP release
        id: beammp
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.beammp_version }}
        run: |
          tag="${INPUT_VERSION:-$(gh api repos/BeamMP/BeamMP-Server/releases/latest --jq .tag_name)}"
          echo "BeamMP $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Image tags without the v: 3.9.3
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # The arm64 image runs apt-get at build time
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/beammp
          tags: |
            type=raw,value=${{ steps.beammp.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && inputs.beammp_version == '' }}
            type=sha
          # metadata-action defaults these to the repo's values (MIT only)
          labels: |
            org.opencontainers.image.licenses=MIT AND AGPL-3.0-or-later
            org.opencontainers.image.version=${{ steps.beammp.outputs.version }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: BEAMMP_RELEASE=tags/${{ steps.beammp.outputs.tag }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
